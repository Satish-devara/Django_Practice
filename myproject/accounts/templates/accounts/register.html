{% extends "accounts/base.html" %}

{% block content %}

<h1>Create Account</h1>

<form method="POST" action="{% url 'register' %}">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">Register</button>
</form>

<p>
    Already registered?
    <a href="{% url 'login' %}">Login</a>
</p>

{% endblock %}
