<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {% for student in students %}
        <p>{{student.name}}</p>
        <p>{{student.attendance}}</p>
        {% if student.attendance >= 75 %}
            <p>Eligible</p>
        {% else %}
            <p>Not Eligible</p>
        {% endif %}
    {% endfor %}

    <p>Total Students: {{students|length}}</p>
</body>
</html>
