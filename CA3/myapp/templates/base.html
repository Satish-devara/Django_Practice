<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Teacher Feedback Portal{% endblock %}</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f4f6f9;margin:0;color:#50d75b}
    header{background:#070707;color:white;padding:16px 6%;display:flex;justify-content:space-between;align-items:center}
    header a{color:white;margin-left:16px;text-decoration:none}
    main{max-width:820px;margin:36px auto;padding:26px;background:white;border-radius:12px;box-shadow:0 4px 18px #00000012}
    label{display:block;font-weight:600;margin:16px 0 6px}
    input,select,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd3dd;border-radius:6px}
    button,.btn{display:inline-block;background:rgb(0, 0, 0);color:white;border:0;padding:11px 18px;border-radius:6px;text-decoration:none;cursor:pointer;margin-top:18px}
    .errorlist{color:#b42318}.muted{color:#667085}.entry{border:1px solid #e1e6ed;border-radius:8px;padding:16px;margin:14px 0}
  </style>
</head>
<body>
<header>
  <strong>Teacher Feedback Portal</strong>
  <nav>
    {% if user.is_authenticated %}
      <a href="{% url 'submit_feedback' %}">Submit</a>
      <a href="{% url 'my_feedback' %}">My feedback</a>
      <form method="post" action="{% url 'logout' %}" style="display:inline">{% csrf_token %}<button style="margin:0;padding:7px 12px">Logout</button></form>
    {% else %}<a href="{% url 'login' %}">Student login</a>{% endif %}
    <!-- <a href="/admin/">Admin</a> -->
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
